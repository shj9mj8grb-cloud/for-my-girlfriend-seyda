<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>For Şeyda ★</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <section id="intro">

    <div class="intro-content">

      <div class="intro-star">✦</div>

      <h1>Happy Birthday</h1>

      <h2>Şeyda</h2>

      <p class="intro-hint">
        Yildizlar senin icin bir seyler sakliyor.
      </p>

      <div class="intro-star">✦</div>

    </div>

  </section>


  <main id="universe">

    <div id="background-stars"></div>

    <div id="special-stars"></div>

    <div id="lily-layer"></div>

  </main>


  <div id="animation-layer"></div>


  <div
    id="star-modal"
    class="hidden"
  >

    <div id="modal-backdrop"></div>

    <div id="star-card">

      <button
        id="close-card"
        aria-label="Close"
      >
        ×
      </button>

      <div class="modal-star">
        ★
      </div>

      <div id="star-content"></div>

    </div>

  </div>


  <button
    id="final-message"
    class="hidden"
    aria-label="Open birthday message"
  >

    <div class="mail-wrapper">

      <svg
        class="mail-icon"
        viewBox="0 0 100 100"
        aria-hidden="true"
      >

        <rect
          x="12"
          y="24"
          width="76"
          height="54"
          rx="10"
        />

        <path d="M17 31 L50 56 L83 31" />
        <path d="M16 72 L39 51" />
        <path d="M84 72 L61 51" />

      </svg>

      <span class="notification-dot"></span>

    </div>

  </button>


  <section
    id="last-thing"
    class="hidden"
  >

    <div class="last-thing-content">

      <div class="last-thing-star">
        ✦
      </div>

      <p>
        VE SON OLARAK...
      </p>

    </div>

  </section>


  <div
    id="video-modal"
    class="hidden"
  >

    <div id="video-backdrop"></div>

    <div id="video-card">

      <button
        id="close-video"
        aria-label="Close video"
      >
        ×
      </button>

      <video
        id="birthday-video"
        controls
        playsinline
        preload="metadata"
      >

        <source
          src="assets/photos/video.mp4"
          type="video/mp4"
        />

        Your browser does not support this video.

      </video>

    </div>

  </div>


  <section
    id="ending"
    class="hidden"
  >

    <div class="ending-overlay"></div>

    <div class="ending-content">

      <div class="ending-star">
        ✦
      </div>

      <h1>
        Happy 18th Birthday
      </h1>

      <h2>
        Şeyda
      </h2>

      <div class="ending-star">
        ★
      </div>

    </div>

  </section>


  <script src="script.js"></script>

</body>

</html>
